name: audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
  schedule:
    - cron: "0 5 * * 0"

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny ${{ matrix.manifest }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest: [Cargo.toml, oracle/Cargo.toml, bench/Cargo.toml, tools/gen-tables/Cargo.toml, fuzz/Cargo.toml]
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.manifest }}
          command: check advisories bans licenses sources
          arguments: --all-features
