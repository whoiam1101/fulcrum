name: perf

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "bench/**"
      - ".github/workflows/perf.yml"
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "bench/**"
      - ".github/workflows/perf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  GUNGRAUN_COLOR: never
  INSTRUCTION_LIMIT: "ir=1%"

jobs:
  vectorization:
    name: vectorization ${{ matrix.isa }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - isa: sse2
            os: ubuntu-24.04
          - isa: avx2
            os: ubuntu-24.04
          - isa: neon
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: the loops of bench/src/loops.rs against the table of bench/src/bin/asm.rs
        working-directory: bench
        env:
          ISA: ${{ matrix.isa }}
        run: cargo run -q --release --bin asm -- "$ISA"

  instructions:
    name: instruction counts against the base commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: gungraun-runner@0.20.0
      - name: base commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1)"
          fi
          echo "base $base"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: baseline, the benchmarks of head on the sources of base
        id: baseline
        env:
          BASE: ${{ steps.base.outputs.sha }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
          GUNGRAUN_HOME: ${{ runner.temp }}/gungraun
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          rm -rf "$RUNNER_TEMP/base/bench"
          cp -r bench "$RUNNER_TEMP/base/bench"
          cd "$RUNNER_TEMP/base/bench"
          if cargo bench --bench instr -- --save-baseline=base; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the benchmarks of head do not build on the base commit, nothing to compare"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: head against the baseline
        if: steps.baseline.outputs.ready == 'true'
        working-directory: bench
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
          GUNGRAUN_HOME: ${{ runner.temp }}/gungraun
        run: |
          set -o pipefail
          cargo bench --bench instr -- --baseline=base --callgrind-limits="$INSTRUCTION_LIMIT" | tee "$RUNNER_TEMP/instr.txt"
      - name: diagnostics of the baseline
        if: always()
        env:
          GUNGRAUN_HOME: ${{ runner.temp }}/gungraun
        run: |
          for b in "$RUNNER_TEMP"/target/release/build/fulcrum-bench/*/out/instr-* "$RUNNER_TEMP"/target/release/deps/instr-*; do
            [ -x "$b" ] || continue
            echo "== $b"
            sym="$(nm "$b" | awk '/2w83add22___gungraun_wrapper_mod3add$/ { print $3; exit }')"
            echo "symbol $sym"
            nm "$b" | awk -v s="$sym" '$3 == s { print $1 }' | while read -r a; do
              echo "symbols at $a:"
              nm -C "$b" | awk -v a="$a" '$1 == a'
            done
            objdump -d --no-show-raw-insn --disassemble="$sym" "$b" | grep -A40 "<$sym>:" || true
            echo "callers of the wrapper:"
            objdump -d --no-show-raw-insn "$b" | grep -E "(call|jmp).*<$sym>" | head -5
          done
          for f in "$GUNGRAUN_HOME"/fulcrum-bench/instr/width8/add.ops/callgrind.add.ops.log.base@base "$GUNGRAUN_HOME"/fulcrum-bench/instr/width8/add.ops/callgrind.add.ops.log; do
            echo "== $f"
            cat "$f" || true
          done
          f="$GUNGRAUN_HOME/fulcrum-bench/instr/width8/add.ops/callgrind.add.ops.out.base@base"
          read -r -a cmd <<< "$(sed -n 's/^cmd: *//p' "$f")"
          valgrind -q --tool=callgrind --collect-atstart=yes --callgrind-out-file="$RUNNER_TEMP/all.out" "${cmd[@]}" > /dev/null || true
          echo "functions named like the wrapper in a full callgrind run of the base:"
          grep -E '^(fn|cfn)=.*gungraun_wrapper' "$RUNNER_TEMP/all.out" | sort -u | head -20 || true
      - name: summary
        if: always() && steps.baseline.outputs.ready == 'true'
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          {
            echo "Instruction counts, head against $BASE, limit $INSTRUCTION_LIMIT"
            echo '```'
            grep -E '^instr::|Instructions:|Gungraun result' "$RUNNER_TEMP/instr.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
