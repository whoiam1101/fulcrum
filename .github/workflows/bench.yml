name: bench

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "bench/benches/**"
      - "bench/src/**"
      - "bench/Cargo.toml"
      - "bench/Cargo.lock"
      - "oracle/src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  platforms:
    name: determinism ${{ matrix.os }}
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bench
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cargo run --release --bin determinism -- --out "determinism-$OS.txt"
        env:
          OS: ${{ matrix.os }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: determinism-${{ matrix.os }}
          path: bench/determinism-${{ matrix.os }}.txt
          if-no-files-found: error
          retention-days: 1

  bench:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs: platforms
    permissions:
      contents: write
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        continue-on-error: true
        with:
          pattern: determinism-*
          path: ${{ runner.temp }}/determinism
          merge-multiple: true
      - name: compare the platforms that delivered their results
        run: |
          if compgen -G "$RUNNER_TEMP/determinism/*.txt" > /dev/null; then
            cargo run --release --bin determinism -- --compare "$RUNNER_TEMP/determinism" > "$RUNNER_TEMP/determinism.md"
            echo "DETERMINISM=$RUNNER_TEMP/determinism.md" >> "$GITHUB_ENV"
          fi
      - run: cargo bench --bench ops -- --warm-up-time 2 --measurement-time 5
      - run: |
          out="results/$(date -u +%F)-github-ubuntu.md"
          cargo run --release --bin report -- ${DETERMINISM:+--determinism "$DETERMINISM"} --readme ../README.md --out "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
      - name: commit results to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../README.md results/*.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bench: update results for ${GITHUB_SHA::7}"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git pull --rebase --depth=50 "$remote" main
          git push "$remote" HEAD:main
