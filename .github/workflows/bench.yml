name: bench

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "bench/benches/**"
      - "bench/src/**"
      - "bench/Cargo.toml"
      - "bench/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v7
      - run: cargo bench --bench ops -- --warm-up-time 2 --measurement-time 5
      - run: cargo run --release --bin report -- --readme ../README.md --out "results/$(date -u +%F)-github-ubuntu.md"
      - run: cargo run -q --release --bin report >> "$GITHUB_STEP_SUMMARY"
      - name: commit results to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../README.md results/*.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bench: update results for ${GITHUB_SHA::7}"
          git pull --rebase --depth=50 origin main
          git push origin HEAD:main
