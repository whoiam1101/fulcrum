name: bench

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "bench/benches/**"
      - "bench/src/**"
      - "bench/Cargo.toml"
      - "bench/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v7
      - run: cargo bench --bench ops -- --warm-up-time 2 --measurement-time 5
      - run: cargo run --release --bin report -- --readme ../README.md --out "results/$(date -u +%F)-github-ubuntu.md"
      - run: cargo run -q --release --bin report >> "$GITHUB_STEP_SUMMARY"
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: bench/update
          delete-branch: true
          add-paths: |
            README.md
            bench/results/*.md
          commit-message: "bench: update results"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          title: "bench: update results"
          body: "Benchmark results for ${{ github.sha }}, generated by the bench workflow. Ratios are significant at 95% confidence; see the Benchmarks section of the README."
