name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test ${{ matrix.os }} ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: beta
          - os: ubuntu-latest
            toolchain: nightly
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal && rustup default ${{ matrix.toolchain }}
      - run: cargo test --features std,float-convert
      - run: cargo test --features std,float-convert --release
      - run: cargo test --features strict-overflow --test strict
      - if: github.event_name == 'schedule'
        run: cargo test --release -- --ignored --skip stress_fixed32_fixed64 --skip algebra_stress --skip fixed32_parse_display_round_trip

  oracle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracle
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --release

  algebra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --release --test algebra -- --include-ignored --nocapture
        env:
          FULCRUM_ALGEBRA_SEED: "1"
          FULCRUM_ALGEBRA_THREADS: "4"
          FULCRUM_ALGEBRA_BATCHES: "8192"

  stress:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --release --test stress -- --ignored --nocapture
        env:
          FULCRUM_STRESS_SECS: "1200"
      - run: cargo test --release --test algebra algebra_stress -- --ignored --nocapture
        env:
          FULCRUM_ALGEBRA_SECS: "600"
      - run: cargo test --release --test exhaustive fixed32_parse_display_round_trip -- --ignored

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse, ops, format]
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install --locked cargo-fuzz
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.60 --profile minimal
      - run: cargo +1.60 build
      - run: cargo +1.60 build --all-features

  targets:
    name: i686 test, thumbv7em no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: rustup target add i686-unknown-linux-gnu thumbv7em-none-eabihf
      - run: cargo test --target i686-unknown-linux-gnu
      - run: cargo test --target i686-unknown-linux-gnu --release --test golden
      - run: cargo build --target thumbv7em-none-eabihf

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: generated tables are up to date
        run: cargo run --manifest-path tools/gen-tables/Cargo.toml -- --check

  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: model-checking/kani-github-action@v1
        with:
          args: -Z stubbing

  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verify/lean
    steps:
      - uses: actions/checkout@v7
      - run: curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
      - run: ~/.elan/bin/lake build
