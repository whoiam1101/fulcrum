name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  JUST_VERSION: "1.58.0"

jobs:
  test:
    name: test ${{ matrix.os }} ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        toolchain: [stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal && rustup default "$TOOLCHAIN"
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
      - run: cargo test --features std,float-convert,serde,bytemuck,num-traits
      - run: cargo test --features std,float-convert --release
      - run: cargo test --features strict-overflow --test strict

  toolchains:
    name: test ubuntu-latest ${{ matrix.toolchain }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        toolchain: [beta, nightly]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal && rustup default "$TOOLCHAIN"
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
      - run: cargo test --features std,float-convert,serde,bytemuck,num-traits
      - run: cargo test --features std,float-convert --release
      - run: cargo test --features strict-overflow --test strict

  exhaustive:
    name: exhaustive ${{ matrix.test }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        test: [trig, radians, inverse, angle, roots, exhaustive]
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cargo test --release --test "$TEST" -- --ignored --skip fixed32_parse_display_round_trip
        env:
          TEST: ${{ matrix.test }}

  oracle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cargo test --release

  algebra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cargo test --release --test algebra -- --include-ignored --nocapture
        env:
          FULCRUM_ALGEBRA_SEED: "1"
          FULCRUM_ALGEBRA_THREADS: "4"
          FULCRUM_ALGEBRA_BATCHES: "8192"

  stress:
    name: stress ${{ matrix.test }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        test: ["stress", "algebra algebra_stress", "exhaustive fixed32_parse_display_round_trip"]
    runs-on: ubuntu-latest
    env:
      FULCRUM_STRESS_SECS: "300"
      FULCRUM_ALGEBRA_SECS: "180"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          read -r -a test <<< "$TEST"
          cargo test --release --test "${test[@]}" -- --ignored --nocapture
        env:
          TEST: ${{ matrix.test }}

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse, ops, format, vec]
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: cargo-fuzz
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$TARGET" -- -max_total_time=600
        env:
          TARGET: ${{ matrix.target }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.60 --profile minimal
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: just@${{ env.JUST_VERSION }}
      - run: just msrv

  features:
    name: features one by one and together
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          for features in serde bytemuck num-traits serde,float-convert serde,bytemuck,num-traits,float-convert; do
            echo "::group::$features"
            cargo build --manifest-path ../Cargo.toml --features "$features"
            cargo test --features "$features"
            echo "::endgroup::"
          done

  powerset:
    name: every feature combination
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: just@${{ env.JUST_VERSION }},cargo-hack
      - run: just hack

  targets:
    name: i686 test, thumbv7em no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: rustup target add i686-unknown-linux-gnu thumbv7em-none-eabihf
      - run: cargo test --target i686-unknown-linux-gnu
      - run: cargo test --target i686-unknown-linux-gnu --release --test golden
      - run: cargo build --target thumbv7em-none-eabihf

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup component add clippy rustfmt
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: just@${{ env.JUST_VERSION }},typos@1.52.2
      - run: just lint

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --component miri
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: just@${{ env.JUST_VERSION }}
      - run: just miri

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: just@${{ env.JUST_VERSION }},cargo-llvm-cov
      - run: set -o pipefail && just cov | tee coverage.txt
      - run: |
          {
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  semver:
    name: semver of the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: cargo-semver-checks
      - name: the version bump covers every API change since the previous tag
        run: |
          version="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "fulcrum") | .version')"
          previous="$(git describe --tags --abbrev=0 --exclude "$version" HEAD)"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null && [ "$(git rev-parse "$version^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "$version is already released, no release in this commit"
            exit 0
          fi
          echo "checking $version against $previous"
          cargo semver-checks --all-features --baseline-rev "$previous"

  mutants:
    name: mutants ${{ matrix.shard }}/8
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21
        with:
          tool: just@${{ env.JUST_VERSION }},cargo-mutants
      - run: just mutants --jobs 4 --sharding round-robin --shard "$SHARD/8"
        env:
          SHARD: ${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants.out

  kani:
    name: kani quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f
        with:
          args: >-
            -Z stubbing -j --output-format=terse --exact
            --harness proofs::double_spec
            --harness proofs::fraction_bits_spec_8
            --harness proofs::fraction_bits_spec_16
            --harness proofs::fraction_bits_spec_32
            --harness proofs::fraction_bits_spec_64
            --harness proofs::accumulator_order_independent_8
            --harness proofs::trig_no_panic_64
            --harness proofs::angle_no_panic_32
            --harness proofs::angle_no_panic_64

  kani-all:
    name: kani all
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f
        with:
          args: -Z stubbing -j --output-format=terse

  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verify/lean
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
      - run: ~/.elan/bin/lake build
