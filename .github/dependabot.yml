version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/bench"
      - "/tools/gen-tables"
      - "/fuzz"
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"
    open-pull-requests-limit: 2
  - package-ecosystem: cargo
    directory: "/oracle"
    schedule:
      interval: weekly
    groups:
      oracle:
        patterns:
          - "*"
    ignore:
      - dependency-name: num-bigint
        versions:
          - ">=0.5"
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
