version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/tools/gen-tables"
      - "/integrations"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directories:
      - "/oracle"
      - "/fuzz"
      - "/bench"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      oracle:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: num-bigint
        versions:
          - ">=0.5"
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
