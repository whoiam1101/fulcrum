version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/oracle"
      - "/bench"
      - "/tools/gen-tables"
      - "/fuzz"
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
