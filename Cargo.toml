[package]
name = "fulcrum"
version = "1.2.0"
edition = "2021"
authors = ["Samvel Safaryan <samvelsafaryan1313@gmail.com>"]
rust-version = "1.60"
publish = false
license = "Apache-2.0"
description = "Deterministic fixed-point math: bit-identical results on every platform, no floats inside."
repository = "https://github.com/whoiam1101/fulcrum"
readme = "README.md"
keywords = ["fixed-point", "deterministic", "no_std", "math", "lockstep"]
categories = ["mathematics", "no-std", "game-development"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[features]
std = []
float-convert = []
strict-overflow = []
serde = ["dep:serde"]
bytemuck = ["dep:bytemuck"]
num-traits = ["dep:num-traits"]

[dependencies]
serde = { version = "1.0.100", optional = true, default-features = false }
bytemuck = { version = "1.7", optional = true, default-features = false }
num-traits = { version = "0.2.14", optional = true, default-features = false }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
many_single_char_names = "allow"
float_arithmetic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
fn_to_numeric_cast_any = "deny"
as_underscore = "deny"
lossy_float_literal = "deny"
float_cmp_const = "deny"
missing_assert_message = "warn"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
codegen-units = 1
lto = "fat"

[workspace]
